name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build Windows exe
    # workflow_dispatch creates the GitHub Release itself. Ignore the follow-up
    # release event from that same token so the installer is built only once.
    if: github.event_name == 'workflow_dispatch' || github.event.release.author.login != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release event otherwise checks out the default branch, not the tag.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          output="$(bash .github/scripts/resolve-release-version.sh "$EVENT_NAME" "$RAW_VERSION")"
          version_line="$(printf '%s\n' "$output" | sed -n '1p')"
          tag_line="$(printf '%s\n' "$output" | sed -n '2p')"
          extra="$(printf '%s\n' "$output" | sed -n '3p')"
          if [ -n "$extra" ] \
            || ! printf '%s\n' "$version_line" | grep -Eq '^APP_VERSION=([0-9]|[1-9][0-9]*)(\.([0-9]|[1-9][0-9]*)){0,3}$' \
            || ! printf '%s\n' "$tag_line" | grep -Eq '^RELEASE_TAG=[vV]?([0-9]|[1-9][0-9]*)(\.([0-9]|[1-9][0-9]*)){0,3}$'; then
            echo "Refusing unexpected version output" >&2
            exit 1
          fi
          printf '%s\n' "$version_line" "$tag_line" >> "$GITHUB_ENV"
          printf '%s\n' "$version_line" "$tag_line"

      - name: Install WiX Toolset 3.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $dest = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          $expected = "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "WiX Toolset checksum mismatch: $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest "candle.exe")) -or -not (Test-Path (Join-Path $dest "light.exe"))) {
            throw "WiX candle.exe or light.exe was not found after extraction"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Package installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          java -version
          mvn -B -ntp -version
          mvn -B -ntp clean package -Pwindows-package "-Dapp.version=$env:APP_VERSION"
          $exe = "target/dist/Finanzplaner-$($env:APP_VERSION).exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            if (Test-Path target/dist) { Get-ChildItem target/dist | Format-Table -AutoSize }
            throw "Installer not found: $exe"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLER_PATH=$exe"

      - name: Attach installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$INSTALLER_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$INSTALLER_PATH" \
              --title "Finanzplaner ${APP_VERSION}" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Windows installer"
            echo ""
            echo "- Version: \`${APP_VERSION}\`"
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- File: \`Finanzplaner-${APP_VERSION}.exe\`"
          } >> "$GITHUB_STEP_SUMMARY"
